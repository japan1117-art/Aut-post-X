name: Auto post to X

on:
  schedule:
    # 09:00, 13:00, 20:00 JST (UTC cron). GitHub schedules may start several minutes late.
    - cron: "0 0,4,11 * * *"
  workflow_dispatch:

concurrency:
  group: x-auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger protected posting endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL" && test -n "$CRON_SECRET"
          curl --fail-with-body --retry 2 --retry-all-errors \
            -X POST "$APP_URL/api/cron/post" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json"
